name: Production build and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the production package as a GitHub Release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      DATABASE_PATH: data/ci.db
      UPLOAD_DIR: data/ci-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node scripts/package-deploy.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: nutric-production
          path: .deploy/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  # The cPanel server pulls the newest release with scripts/cpanel-pull.sh (cron).
  release:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: nutric-release
      cancel-in-progress: false
    steps:
      - name: Validate SITE_ORIGIN
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: |
          if [[ ! "$SITE_ORIGIN" =~ ^https://[^/]+$ ]]; then
            echo '::error::SITE_ORIGIN must be an HTTPS origin without a path or trailing slash.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: nutric-production
          path: .deploy/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tar -C .deploy -czf nutric-production.tar.gz .
          tag="build-${{ github.run_number }}"
          gh release create "$tag" nutric-production.tar.gz --target "$GITHUB_SHA" \
            --title "Build ${{ github.run_number }}" \
            --notes "Picked up automatically by the cPanel cron job." --latest
          # Keep the five newest releases.
          gh release list --limit 100 --json tagName --jq '.[5:][].tagName' |
            xargs -r -n1 gh release delete --cleanup-tag --yes
          echo "### Released $tag. The server deploys it on its next cron run." >> "$GITHUB_STEP_SUMMARY"
