name: Production build and cPanel SSH

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the production package to cPanel over SSH
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      DATABASE_PATH: data/ci.db
      UPLOAD_DIR: data/ci-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node scripts/package-deploy.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: nutric-production
          path: .deploy/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: nutric-cpanel-production
      cancel-in-progress: false
    steps:
      - name: Validate deployment configuration
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        shell: bash
        run: |
          for key in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS DEPLOY_DIR SITE_ORIGIN; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing configuration: $key"
              exit 1
            fi
          done
          if [[ ! "$DEPLOY_DIR" =~ ^/home/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)+$ ]]; then
            echo '::error::DEPLOY_DIR must be an absolute application folder below /home/USER, without a trailing slash.'
            exit 1
          fi
          if [[ ! "$SITE_ORIGIN" =~ ^https://[^/]+$ ]]; then
            echo '::error::SITE_ORIGIN must be an HTTPS origin without a path or trailing slash.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: nutric-production
          path: .deploy/
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s
' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s
' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Upload application files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        shell: bash
        run: |
          # One compressed stream into a staging folder; nothing live is touched yet.
          tar -C .deploy -czf - . | ssh -i "$HOME/.ssh/deploy_key" -p "$SSH_PORT"             -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST"             "rm -rf '$DEPLOY_DIR/.incoming' && mkdir -p '$DEPLOY_DIR/.incoming' && tar -xzf - -C '$DEPLOY_DIR/.incoming'"
      - name: Install dependencies and restart
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          NODE_ACTIVATE: ${{ vars.NODE_ACTIVATE }}
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes             "$SSH_USER@$SSH_HOST" bash -s -- "$DEPLOY_DIR" "$NODE_ACTIVATE" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          # Only build/ and drizzle/ are replaced; shared data, .env, node_modules and tmp/ stay.
          rm -rf build drizzle
          mv .incoming/build .incoming/drizzle .
          mv -f .incoming/package.json .incoming/package-lock.json .incoming/app.cjs .
          rm -rf .incoming
          if [[ -n "${2:-}" ]]; then eval "$2"; fi
          npm ci --omit=dev
          mkdir -p tmp
          touch tmp/restart.txt
          REMOTE
      - name: Summary
        run: echo '### Deployed. Passenger restarts the app on the next request.' >> "$GITHUB_STEP_SUMMARY"
